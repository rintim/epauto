name: Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Log in to ghcr.io
        run: podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<< "$GITHUB_TOKEN"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          set -euo pipefail

          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # v0.6.0 -> 0.6.0 + latest
            tags=("${GITHUB_REF_NAME#v}" latest)
          else
            # 分支构建以分支名为标签，如 main
            tags=("${GITHUB_REF_NAME//\//-}")
          fi

          podman build . \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$image:${tags[0]}"

          for tag in "${tags[@]}"; do
            podman push "$image:${tags[0]}" "docker://$image:$tag"
          done
